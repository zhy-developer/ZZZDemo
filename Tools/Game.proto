package GameProtocol;

enum CSID{
	TCP_LOGIN = 1;						//TcpLogin

	TCP_REQUEST_MATCH = 10;				//TcpRequestMatch
	TCP_CANCEL_MATCH = 11;				//TcpCancelMatch

	UDP_BATTLE_READY = 51;				//UdpBattleReady
	UDP_UP_PLAYER_OPERATIONS = 53;		//UdpUpPlayerOperations
	UDP_UP_DELTA_FRAMES = 55;			//UdpUpDeltaFrames
	UDP_UP_GAME_OVER = 57;				//UdpUpGameOver
}

enum SCID{
	TCP_RESPONSE_LOGIN = 1;				//TcpResponseLogin

	TCP_RESPONSE_REQUEST_MATCH = 10;	//TcpResponseRequestMatch
	TCP_RESPONSE_CANCEL_MATCH = 11;		//TcpResponseCancelMatch

	TCP_ENTER_BATTLE = 50;				//TcpEnterBattle
	UDP_BATTLE_START = 51;				//UdpBattleStart
	UDP_DOWN_FRAME_OPERATIONS = 53;		//UdpDownFrameOperations
	UDP_DOWN_DELTA_FRAMES = 55;			//UdpDownDeltaFrames
	UDP_DOWN_GAME_OVER = 57;			//UdpDownGameOver
}

enum TeamType
{
	NO = 0;
	TEAM1 = 1;
	TEAM2 = 2;
	TEAM3 = 3;
	TEAM4 = 4;
}

message TcpLogin{
	required string token = 1;
}

//登录相关
message TcpResponseLogin{
	required bool result = 1;
	required int32 uid = 2;
	required int32 udpPort = 3;
}

//匹配相关
message TcpResponseRequestMatch{
	required bool result = 1;
}

message TcpRequestMatch{
	required int32 uid = 1;
	required int32 roleId = 2;
}

message TcpResponseCancelMatch{
	required bool result = 1;
}

message TcpRequestCancelMatch{
	required int32 uid = 1;
}

//战场相关

message BattleUserInfo {
    required int32 uid = 1;
    required int32 battleID = 2;
    required int32 roleID = 3;
}

message TcpEnterBattle {
    required int32 randSeed = 1;
    repeated BattleUserInfo battleUserInfo = 2;
}

message UdpBattleReady {
    required int32 uid = 1;
    required int32 battleID = 2;
}

message UdpBattleStart {
}

enum RightOpType {
    noop = 0;
    rop1 = 1;
    rop2 = 2;
    rop3 = 3;
    rop4 = 4;
    rop5 = 5;
    rop6 = 6;
    rop7 = 7;
}

message PlayerOperation {
    required int32 battleID = 1;
    required int32 move = 2;
    optional int32 operationID = 3 [default = 0];
    optional RightOpType rightOperation = 4 [default = noop];
    optional int32 operationValue1 = 5 [default = 0];
    optional int32 operationValue2 = 6 [default = 0];
}

message UdpUpPlayerOperations {
    required int32 mesID = 1;
    required PlayerOperation operation = 2;
}

message AllPlayerOperation {
    repeated PlayerOperation operations = 1;
}

message UdpDownFrameOperations {
    required int32 frameID = 1;
    required AllPlayerOperation operations = 2;
}

message UdpUpDeltaFrames {
    required int32 battleID = 1;
    repeated int32 frames = 2 [packed = false];
}

message UdpDownDeltaFrames {
    repeated UdpDownFrameOperations framesData = 1;
}

message UdpUpGameOver {
    required int32 battleID = 1;
}

message UdpDownGameOver {
}

//角色移动
message MoveInput{
    required int32 playerId = 1;
    required int32 frame = 2;
    optional float horizontal = 3;
    optional float vertical = 4;
}