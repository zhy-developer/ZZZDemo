<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <filter id="glow-cyan" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-red" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .cyan{fill:none;stroke:#00eaff;stroke-width:8;stroke-linecap:round;filter:url(#glow-cyan)}
      .red{fill:none;stroke:#ff1e35;stroke-width:9;stroke-linecap:round;filter:url(#glow-red)}
      .white{fill:#f7fbff}
      .black{fill:#05070c}
      .yellow{fill:#ffea21}
      .magenta{fill:#ff207e}
      .label{font-family:Impact,Arial Black,sans-serif;font-style:italic;fill:#fff}
    </style>
  </defs>

  <g id="lock_on_reticle" transform="translate(120 95)">
    <circle cx="140" cy="140" r="70" class="cyan"/>
    <circle cx="140" cy="140" r="20" class="cyan"/>
    <path class="cyan" d="M140 24 V72 M140 208 V256 M24 140 H72 M208 140 H256"/>
    <path class="cyan" d="M74 51 L96 73 M206 51 L184 73 M74 229 L96 207 M206 229 L184 207"/>
    <circle cx="140" cy="140" r="7" fill="#fff"/>
  </g>

  <g id="warning_ring" transform="translate(470 95)">
    <circle cx="140" cy="140" r="92" class="red"/>
    <path class="red" d="M140 20 V52 M140 228 V260 M20 140 H52 M228 140 H260"/>
    <path fill="#ff1e35" d="M140 58 L213 194 H67 Z"/>
    <rect x="131" y="102" width="18" height="54" fill="#05070c"/>
    <rect x="131" y="166" width="18" height="18" fill="#05070c"/>
  </g>

  <g id="combo_counter" transform="translate(820 80)">
    <path class="black" d="M0 80 L60 18 H270 L330 70 L284 204 H54 Z"/>
    <path d="M8 82 L62 28 H260 L318 72 L276 192 H60 Z" fill="none" stroke="#ff207e" stroke-width="8"/>
    <path d="M40 32 L210 0 L330 42 L226 64 Z" fill="#ff207e"/>
    <text class="label" x="45" y="70" font-size="38">COMBO</text>
    <text class="label" x="62" y="166" font-size="108" fill="#ffea21">47</text>
    <text class="label" x="202" y="162" font-size="38">HITS</text>
  </g>

  <g id="damage_number_plate" transform="translate(100 440)">
    <path d="M0 58 L68 28 L88 0 L256 0 L316 50 L238 96 L30 104 Z" fill="#081018"/>
    <path d="M10 60 L72 34 L92 10 L246 10 L300 50 L232 86 L34 94 Z" fill="none" stroke="#00eaff" stroke-width="5"/>
    <text class="label" x="70" y="75" font-size="72">1297</text>
  </g>

  <g id="critical_plate" transform="translate(480 420)">
    <path d="M0 80 L72 22 L102 0 H360 L444 70 L326 146 H52 Z" fill="#09050a"/>
    <path d="M18 82 L82 32 L108 12 H348 L426 70 L318 132 H60 Z" fill="none" stroke="#ff1f35" stroke-width="7"/>
    <path d="M40 0 L242 22 L92 46 Z" fill="#ff1f35"/>
    <path d="M218 128 L444 64 L322 152 Z" fill="#ff207e"/>
    <text class="label" x="56" y="70" font-size="54" fill="#ffea21">CRITICAL</text>
    <text class="label" x="94" y="132" font-size="84" fill="#ffea21">8497</text>
  </g>

  <g id="mission_objective_tag" transform="translate(980 450)">
    <path d="M0 42 L42 0 H450 L516 38 L472 104 H40 Z" fill="#081018"/>
    <path d="M10 42 L46 10 H440 L500 39 L464 92 H44 Z" fill="none" stroke="#ffea21" stroke-width="6"/>
    <path d="M28 34 L58 16 H98 L124 46 L96 78 H54 Z" fill="#ffea21"/>
    <rect x="72" y="30" width="8" height="28" fill="#081018"/>
    <rect x="72" y="64" width="8" height="8" fill="#081018"/>
    <text class="label" x="146" y="58" font-size="34">OBJECTIVE</text>
    <path d="M146 70 H362 L346 86 H146 Z" fill="#ffea21"/>
    <text class="label" x="384" y="78" font-size="48" fill="#ffea21">2/5</text>
  </g>
</svg>
