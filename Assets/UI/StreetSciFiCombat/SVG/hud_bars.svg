<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <filter id="glow-cyan" x="-30%" y="-60%" width="160%" height="220%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glow-magenta" x="-30%" y="-60%" width="160%" height="220%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="hp-fill" x1="0" x2="1">
      <stop offset="0" stop-color="#29ff87"/>
      <stop offset="0.62" stop-color="#b6ff18"/>
      <stop offset="1" stop-color="#fff04a"/>
    </linearGradient>
    <linearGradient id="enemy-fill" x1="0" x2="1">
      <stop offset="0" stop-color="#ff1a76"/>
      <stop offset="1" stop-color="#ff4937"/>
    </linearGradient>
    <linearGradient id="sp-fill" x1="0" x2="1">
      <stop offset="0" stop-color="#ffef2d"/>
      <stop offset="1" stop-color="#00eaff"/>
    </linearGradient>
    <linearGradient id="shield-fill" x1="0" x2="1">
      <stop offset="0" stop-color="#11cfff"/>
      <stop offset="1" stop-color="#4bfff1"/>
    </linearGradient>
    <linearGradient id="anomaly-fill" x1="0" x2="1">
      <stop offset="0" stop-color="#9b35ff"/>
      <stop offset="1" stop-color="#ff22f8"/>
    </linearGradient>
    <style>
      .ink{fill:#061019}
      .panel{fill:#08131c;stroke:#111;stroke-width:8;stroke-linejoin:round}
      .edge-cyan{fill:none;stroke:#08dfff;stroke-width:5;stroke-linejoin:round;filter:url(#glow-cyan)}
      .edge-magenta{fill:none;stroke:#ff167c;stroke-width:5;stroke-linejoin:round;filter:url(#glow-magenta)}
      .white{fill:#f6f7ff}
      .muted{fill:#3b4b57}
      .label{font-family:Impact,Arial Black,sans-serif;font-size:38px;font-style:italic;fill:#fff}
      .small{font-family:Arial Black,Arial,sans-serif;font-size:24px;fill:#fff}
    </style>
  </defs>

  <g id="player_hp_bar" transform="translate(80 80)">
    <path class="panel" d="M0 44 L54 0 H724 L790 36 L748 96 H42 Z"/>
    <path class="edge-cyan" d="M7 44 L58 8 H716 L776 38 L739 86 H48 Z"/>
    <path class="ink" d="M170 34 H684 L720 54 L704 70 H160 Z"/>
    <path d="M180 39 H622 L649 54 L636 64 H172 Z" fill="url(#hp-fill)"/>
    <path d="M161 74 H500 L488 88 H142 Z" fill="#00d6ff"/>
    <text class="label" x="74" y="68">HP</text>
    <text class="small" x="590" y="68">4320</text>
    <path d="M32 44 L72 16 H142 L112 84 H42 Z" fill="#0d2633" stroke="#08dfff" stroke-width="4"/>
  </g>

  <g id="enemy_hp_bar" transform="translate(80 215)">
    <path class="panel" d="M0 34 L44 0 H730 L790 34 L758 82 H30 Z"/>
    <path class="edge-magenta" d="M8 34 L48 8 H720 L776 34 L750 72 H36 Z"/>
    <path class="ink" d="M176 28 H694 L724 43 L714 58 H166 Z"/>
    <path d="M184 32 H650 L678 43 L668 54 H176 Z" fill="url(#enemy-fill)"/>
    <text class="label" x="78" y="56">ENEMY</text>
    <path d="M30 30 L70 8 H130 L112 72 H34 Z" fill="#24101c" stroke="#ff167c" stroke-width="4"/>
  </g>

  <g id="energy_bar" transform="translate(80 350)">
    <path class="panel" d="M0 34 L36 0 H650 L706 30 L680 74 H30 Z"/>
    <path class="edge-cyan" d="M8 34 L40 8 H642 L692 31 L672 64 H36 Z"/>
    <path class="ink" d="M150 28 H604 L632 42 L624 54 H140 Z"/>
    <g fill="url(#sp-fill)">
      <path d="M158 32 H250 L240 50 H148 Z"/>
      <path d="M266 32 H358 L348 50 H256 Z"/>
      <path d="M374 32 H466 L456 50 H364 Z"/>
      <path d="M482 32 H574 L564 50 H472 Z"/>
    </g>
    <path d="M32 28 L66 8 H114 L92 66 H34 Z" fill="#09202c" stroke="#08dfff" stroke-width="4"/>
    <path d="M72 16 L52 43 H74 L60 62 L94 28 H72 Z" fill="#00f1ff"/>
    <text class="label" x="116" y="55">SP</text>
  </g>

  <g id="shield_bar" transform="translate(80 470)">
    <path class="panel" d="M0 34 L36 0 H650 L706 30 L680 74 H30 Z"/>
    <path class="edge-cyan" d="M8 34 L40 8 H642 L692 31 L672 64 H36 Z"/>
    <path class="ink" d="M150 28 H604 L632 42 L624 54 H140 Z"/>
    <g fill="url(#shield-fill)">
      <path d="M158 32 H236 L226 50 H148 Z"/>
      <path d="M250 32 H328 L318 50 H240 Z"/>
      <path d="M342 32 H420 L410 50 H332 Z"/>
      <path d="M434 32 H512 L502 50 H424 Z"/>
      <path d="M526 32 H604 L594 50 H516 Z"/>
    </g>
    <path d="M32 28 L66 8 H114 L92 66 H34 Z" fill="#09202c" stroke="#08dfff" stroke-width="4"/>
    <path d="M72 18 L96 30 L88 54 L72 64 L56 54 L48 30 Z" fill="#47f8ff"/>
    <text class="label" x="116" y="55">SHIELD</text>
  </g>

  <g id="anomaly_bar" transform="translate(80 590)">
    <path class="panel" d="M0 34 L36 0 H650 L706 30 L680 74 H30 Z"/>
    <path class="edge-magenta" d="M8 34 L40 8 H642 L692 31 L672 64 H36 Z"/>
    <path class="ink" d="M150 28 H604 L632 42 L624 54 H140 Z"/>
    <path d="M158 32 H526 L556 43 L544 54 H148 Z" fill="url(#anomaly-fill)"/>
    <path d="M32 28 L66 8 H114 L92 66 H34 Z" fill="#1d0d2d" stroke="#d429ff" stroke-width="4"/>
    <path d="M80 24 C100 38 82 62 58 54 C82 50 84 38 70 30 C56 22 62 8 78 12 C72 16 72 20 80 24 Z" fill="#db42ff"/>
    <text class="label" x="116" y="55">ANOMALY</text>
  </g>
</svg>
