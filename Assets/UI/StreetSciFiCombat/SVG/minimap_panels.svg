<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M42 0 H0 V42" fill="none" stroke="#12445d" stroke-width="2" opacity="0.72"/>
    </pattern>
    <filter id="glow" x="-35%" y="-35%" width="170%" height="170%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .panel{fill:#07111a;stroke:#061019;stroke-width:10;stroke-linejoin:round}
      .edge{fill:none;stroke:#00e5ff;stroke-width:6;stroke-linejoin:round;filter:url(#glow)}
      .yellow{fill:#ffea21}
      .magenta{fill:#ff207e}
      .cyan{fill:#00e5ff}
      .label{font-family:Arial Black,Arial,sans-serif;font-size:28px;fill:#fff}
    </style>
  </defs>

  <g id="minimap_frame" transform="translate(80 80)">
    <path class="panel" d="M0 88 L88 0 H502 L590 76 V420 L510 500 H72 L0 430 Z"/>
    <path class="edge" d="M18 92 L94 18 H494 L572 80 V410 L502 482 H80 L18 422 Z"/>
    <path d="M72 90 L130 42 H462 L520 96 V382 L470 432 H124 L72 380 Z" fill="#0a2638"/>
    <path d="M72 90 L130 42 H462 L520 96 V382 L470 432 H124 L72 380 Z" fill="url(#grid)" opacity="0.8"/>
    <path d="M210 62 L184 178 L304 142 L430 250 L392 384 L260 330 L150 430" fill="none" stroke="#25728f" stroke-width="5" opacity="0.8"/>
    <path class="yellow" d="M300 245 L328 316 L286 294 L244 316 Z"/>
    <circle cx="206" cy="150" r="12" class="magenta"/>
    <circle cx="386" cy="210" r="12" class="magenta"/>
    <circle cx="438" cy="330" r="12" class="magenta"/>
    <circle cx="160" cy="360" r="9" class="cyan"/>
    <text class="label" x="274" y="48">N</text>
  </g>

  <g id="pause_panel" transform="translate(820 90)">
    <path class="panel" d="M0 70 L70 0 H520 L590 70 V430 L520 500 H70 L0 430 Z"/>
    <path class="edge" d="M20 76 L76 20 H514 L570 76 V424 L514 480 H76 L20 424 Z"/>
    <text class="label" x="90" y="110" font-size="54">PAUSE</text>
    <path d="M90 146 H500 L486 170 H90 Z" fill="#00e5ff"/>
    <g transform="translate(90 220)">
      <path d="M0 0 H390 L430 36 L390 72 H0 Z" fill="#101d27" stroke="#ffea21" stroke-width="4"/>
      <text class="label" x="32" y="48">RESUME</text>
    </g>
    <g transform="translate(90 318)">
      <path d="M0 0 H390 L430 36 L390 72 H0 Z" fill="#101d27" stroke="#00e5ff" stroke-width="4"/>
      <text class="label" x="32" y="48">SETTINGS</text>
    </g>
  </g>
</svg>
